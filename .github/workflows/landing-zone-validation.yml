name: AWS landing zone static validation

on:
  pull_request:
    paths:
      - '01-enterprise-landing-zone/**'
      - '.github/workflows/landing-zone-validation.yml'
  push:
    branches: [main]
    paths:
      - '01-enterprise-landing-zone/**'
      - '.github/workflows/landing-zone-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Repository contract regression tests
        working-directory: 01-enterprise-landing-zone
        run: python -m unittest discover -s tests -v
      - name: Check shell script syntax
        run: |
          for f in 01-enterprise-landing-zone/scripts/*.sh; do bash -n "$f"; done
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'
          terraform_wrapper: false
      - name: Format Terraform for full syntax validation
        run: terraform -chdir=01-enterprise-landing-zone/terraform/terraform fmt -recursive
      - name: Initialize without state backend
        run: terraform -chdir=01-enterprise-landing-zone/terraform/terraform init -backend=false -input=false
      - name: Terraform provider schema validation
        run: terraform -chdir=01-enterprise-landing-zone/terraform/terraform validate -no-color
      - name: Verify committed Terraform formatting
        run: |
          git diff -- 01-enterprise-landing-zone/terraform/terraform
          git diff --exit-code -- 01-enterprise-landing-zone/terraform/terraform
