name: Terraform VPC lab validation
on:
  pull_request:
    paths:
      - '05-aws-vpc-terraform-lab/**'
      - '.github/workflows/terraform-vpc-validation.yml'
  push:
    branches: [main]
    paths:
      - '05-aws-vpc-terraform-lab/**'
      - '.github/workflows/terraform-vpc-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

# Prevent superseded runs from consuming CI resources.
concurrency:
  group: terraform-vpc-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: 05-aws-vpc-terraform-lab
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: '1.9.8'
      - name: Check formatting
        run: terraform fmt -check -recursive
      - name: Initialize with locked provider dependency
        run: terraform init -backend=false -input=false -lockfile=readonly
      - name: Validate
        run: terraform validate -no-color
      - name: Test network behavior using a mocked AWS provider
        run: terraform test -no-color
      - name: Test offline VPC Flow Logs analyzer
        run: python3 -m unittest discover -s observability -p 'test_*.py' -v
      - name: Produce synthetic incident summary
        run: python3 observability/analyze_flow_logs.py observability/sample-flow-logs.log
