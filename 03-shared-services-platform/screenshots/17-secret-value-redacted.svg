<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="740" viewBox="0 0 1280 740" role="img" aria-labelledby="title desc">
<title id="title">AWS Secrets Manager: sanitized illustration of secret-value handling</title>
<desc id="desc">Portfolio-safe diagram showing a protected database secret, placeholders for its account and value, and guidance for not exposing credentials. This is an illustration, not an original AWS console screenshot.</desc>
<defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#0b1726"/><stop offset="1" stop-color="#183447"/></linearGradient><linearGradient id="card" x1="0" x2="1"><stop offset="0" stop-color="#182b40"/><stop offset="1" stop-color="#203b51"/></linearGradient></defs>
<rect width="1280" height="740" fill="url(#bg)"/>
<rect x="48" y="45" width="1184" height="650" rx="25" fill="url(#card)" stroke="#426179" stroke-width="2"/>
<text x="90" y="104" fill="#75e3cb" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" letter-spacing="2">PORTFOLIO EVIDENCE · SAFE REPRESENTATION</text>
<text x="90" y="160" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="36" font-weight="700">Secrets Manager — protected configuration</text>
<text x="90" y="204" fill="#b9cede" font-family="Arial,Helvetica,sans-serif" font-size="20">Illustrative, redacted presentation — not a live console capture</text>
<rect x="90" y="244" width="1090" height="302" rx="18" fill="#0e2030" stroke="#37566d"/>
<text x="124" y="293" fill="#a9dcca" font-family="Arial" font-size="18" font-weight="700">SECRET METADATA</text>
<text x="124" y="341" fill="#9db2c7" font-family="Arial" font-size="18">Name</text>
<text x="505" y="341" fill="#fff" font-family="Arial" font-size="21">example/shared/database</text>
<line x1="124" x2="1138" y1="367" y2="367" stroke="#36546b"/>
<text x="124" y="412" fill="#9db2c7" font-family="Arial" font-size="18">Account &amp; resource identifiers</text>
<text x="505" y="412" fill="#75e3cb" font-family="Arial" font-size="20" font-weight="700">[REDACTED]</text>
<line x1="124" x2="1138" y1="440" y2="440" stroke="#36546b"/>
<text x="124" y="483" fill="#9db2c7" font-family="Arial" font-size="18">Username and secret value</text>
<text x="505" y="483" fill="#75e3cb" font-family="Arial" font-size="20" font-weight="700">[REDACTED · NOT INCLUDED]</text>
<text x="90" y="601" fill="#edf5ff" font-family="Arial" font-size="19" font-weight="700">Demonstrated practice</text>
<text x="90" y="636" fill="#c0d0df" font-family="Arial" font-size="19">Store sensitive data in a secrets manager; use scoped IAM access and rotation.</text>
<text x="90" y="668" fill="#c0d0df" font-family="Arial" font-size="19">Never publish account identifiers, credentials, tokens, or retrieved secret values.</text>
</svg>