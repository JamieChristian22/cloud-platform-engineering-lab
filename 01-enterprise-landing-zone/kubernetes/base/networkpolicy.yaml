apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: enterprise-web-network-policy
  namespace: enterprise-landing-zone
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: enterprise-web
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        # In-namespace components can reach the service.
        - podSelector: {}
        # Adjust these labels if the ingress controller is installed elsewhere.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # The demo NGINX page needs no general internet egress. Allow cluster DNS only.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
